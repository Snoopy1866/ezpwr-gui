[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ezpwr-gui"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "ezpwr>=0.0.8",
    "pyside6>=6.11.1",
    "scipy<1.18"
]

[project.scripts]
ezpwr-gui = "ezpwr_gui.main:main"

[dependency-groups]
dev = ["nuitka>=4.1.3", "ruff>=0.16.1"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
