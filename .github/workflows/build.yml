name: Build & Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: ezpwr-gui-windows
            dist_path: dist/main.dist
          - os: ubuntu-latest
            artifact_name: ezpwr-gui-linux
            dist_path: dist/main.dist
          - os: macos-latest
            artifact_name: ezpwr-gui-macos
            dist_path: dist/main.app

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 获取完整提交历史及所有 Tags，确保 git describe 能够正确读取 Tag
          fetch-depth: 0

      - name: Determine Version
        id: get_version
        run: |
          # 1. 使用 || true 确保即使 git describe 失败（如没有 tag），也不会抛出 exit status 128
          RAW_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)

          # 2. 剥离前缀 v，并截断 prerelease 后缀（如 v1.0.0-rc1 -> 1.0.0）
          #    Nuitka 的 --product-version / --macos-app-version 只接受纯数字版本号，
          #    包含字母或连字符会直接解析失败
          VERSION=$(echo "$RAW_TAG" | sed 's/^v//; s/-.*//')

          # 3. 如果没找到历史 Tag，回退使用 0.0.1
          if [ -z "$VERSION" ]; then
            VERSION="0.0.1"
          fi

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install Dependencies
        run: |
          uv sync --group dev

      - name: Build Executable with Nuitka
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          EXTRA_ARGS=""

          if [ "${{ runner.os }}" = "macOS" ]; then
            EXTRA_ARGS="--macos-app-version=${VERSION}"
          fi

          uv run python -m nuitka --product-version="${VERSION}" $EXTRA_ARGS src/ezpwr_gui/main.py

      - name: Compress Build Artifact
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          FILENAME="${{ matrix.artifact_name }}-v${VERSION}"

          if [ "${{ runner.os }}" = "Windows" ]; then
            uv run python -c "import shutil; shutil.make_archive('$FILENAME', 'zip', root_dir='${{ matrix.dist_path }}')"
          elif [ "${{ runner.os }}" = "Linux" ]; then
            uv run python -c "import shutil; shutil.make_archive('$FILENAME', 'gztar', root_dir='${{ matrix.dist_path }}')"
          else
            # macOS 必须保留 .app 外壳：将 main.app 作为 zip 的顶层目录打包，
            # 否则用户解压后只会得到 Contents/ 目录，无法作为应用运行
            DIST_DIR=$(dirname "${{ matrix.dist_path }}")
            APP_NAME=$(basename "${{ matrix.dist_path }}")
            uv run python -c "import shutil; shutil.make_archive('$FILENAME', 'zip', root_dir='$DIST_DIR', base_dir='$APP_NAME')"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}-v${{ steps.get_version.outputs.VERSION }}
          path: ${{ matrix.artifact_name }}-v${{ steps.get_version.outputs.VERSION }}.*
          archive: false

  draft-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-artifacts
          merge-multiple: true
          skip-decompress: true

      - name: Create Draft Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          prerelease: false
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
